---
- name: Prompt12 resumed single-transition orchestration
  hosts: "{{ sci_oran_prompt12_inventory_target | default('tb3-dell') }}"
  gather_facts: false
  any_errors_fatal: true

  vars:
    sci_oran_prompt12_repo_root_default: >-
      /home/khoshaba/project/tcd-oran-testbed-integration
    sci_oran_prompt12_materializer_relpath: >-
      scripts/experiment-harness/prompt12-resume-single-transition-materializer.py
    sci_oran_prompt12_live_authorization_token_expected: >-
      AUTHORISE_PROMPT12_RESUMED_T2_26_TO_39_LIVE
    sci_oran_prompt12_readback_window_end_placeholder: >-
      @PROMPT12_READBACK_WINDOW_END@

  pre_tasks:
    - name: Validate orchestration mode
      ansible.builtin.assert:
        that:
          - sci_oran_prompt12_mode | default('offline-validate') in ['offline-validate', 'live']
        fail_msg: PROMPT12_MODE_INVALID

    - name: Validate required common inputs
      ansible.builtin.assert:
        that:
          - sci_oran_prompt12_expected_repo_sha is defined
          - sci_oran_prompt12_expected_repo_sha | length == 40
          - sci_oran_prompt12_binding_manifest is defined
          - sci_oran_prompt12_binding_manifest | length > 0
          - sci_oran_prompt12_resume_materialization is defined
          - sci_oran_prompt12_resume_materialization | length > 0
          - sci_oran_prompt12_single_transition_output is defined
          - sci_oran_prompt12_single_transition_output | length > 0
        fail_msg: PROMPT12_REQUIRED_INPUT_MISSING

    - name: Resolve repository root
      ansible.builtin.set_fact:
        sci_oran_prompt12_repo_root: >-
          {{
            sci_oran_prompt12_repo_root
            | default(sci_oran_prompt12_repo_root_default)
          }}

    - name: Read target repository HEAD
      ansible.builtin.command:
        argv:
          - git
          - -C
          - "{{ sci_oran_prompt12_repo_root }}"
          - rev-parse
          - HEAD
      register: sci_oran_prompt12_repo_head
      changed_when: false

    - name: Prove approved repository SHA
      ansible.builtin.assert:
        that:
          - sci_oran_prompt12_repo_head.stdout | trim == sci_oran_prompt12_expected_repo_sha
        fail_msg: PROMPT12_REPOSITORY_SHA_MISMATCH

    - name: Read target repository worktree state
      ansible.builtin.command:
        argv:
          - git
          - -C
          - "{{ sci_oran_prompt12_repo_root }}"
          - status
          - --porcelain
      register: sci_oran_prompt12_repo_status
      changed_when: false

    - name: Require clean target repository
      ansible.builtin.assert:
        that:
          - sci_oran_prompt12_repo_status.stdout | trim == ''
        fail_msg: PROMPT12_TARGET_REPOSITORY_DIRTY

    - name: Check single-transition output path
      ansible.builtin.stat:
        path: "{{ sci_oran_prompt12_single_transition_output }}"
      register: sci_oran_prompt12_output_stat

    - name: Require fresh single-transition output
      ansible.builtin.assert:
        that:
          - not sci_oran_prompt12_output_stat.stat.exists
        fail_msg: PROMPT12_SINGLE_TRANSITION_OUTPUT_ALREADY_EXISTS

  tasks:
    - name: Materialize resumed T2 single-transition description
      ansible.builtin.command:
        argv:
          - python3
          - "{{ sci_oran_prompt12_repo_root }}/{{ sci_oran_prompt12_materializer_relpath }}"
          - --binding-manifest
          - "{{ sci_oran_prompt12_binding_manifest }}"
          - --resume-materialization
          - "{{ sci_oran_prompt12_resume_materialization }}"
          - --initial-transition-index
          - "2"
          - --output
          - "{{ sci_oran_prompt12_single_transition_output }}"
      register: sci_oran_prompt12_materialize
      changed_when: true

    - name: Require successful nonexecuting materialization markers
      ansible.builtin.assert:
        that:
          - "'MATERIALIZATION_GATE=PASS' in sci_oran_prompt12_materialize.stdout"
          - "'FIRST_SCIENTIFIC_TRANSITION=T2' in sci_oran_prompt12_materialize.stdout"
          - "'EXPECTED_TIMELINE_EVENT_COUNT=3' in sci_oran_prompt12_materialize.stdout"
          - "'T3_HANDOFF_PRESENT=NO' in sci_oran_prompt12_materialize.stdout"
          - "'CONTROL_EXECUTED=NO' in sci_oran_prompt12_materialize.stdout"
          - "'TRAFFIC_EXECUTED=NO' in sci_oran_prompt12_materialize.stdout"
        fail_msg: PROMPT12_SINGLE_TRANSITION_MATERIALIZATION_INVALID

    - name: Read materialized single-transition description
      ansible.builtin.slurp:
        src: "{{ sci_oran_prompt12_single_transition_output }}"
      register: sci_oran_prompt12_materialized_raw

    - name: Decode materialized single-transition description
      ansible.builtin.set_fact:
        sci_oran_prompt12_single: >-
          {{
            sci_oran_prompt12_materialized_raw.content
            | b64decode
            | from_json
          }}

    - name: Validate frozen T2-only invariants
      ansible.builtin.assert:
        that:
          - sci_oran_prompt12_single.schema == 'sci_oran_prompt12_resume_single_transition_materialization_v1'
          - sci_oran_prompt12_single.transition_label == 'T2'
          - sci_oran_prompt12_single.transition_index == 2
          - sci_oran_prompt12_single.executed_transition_ordinal == 1
          - sci_oran_prompt12_single.expected_timeline_event_count == 3
          - not sci_oran_prompt12_single.synthetic_prior_transition_events
          - not sci_oran_prompt12_single.skipped_transition_bindings_consumed
          - not sci_oran_prompt12_single.t3_handoff_present
          - not sci_oran_prompt12_single.t3_trigger_present
          - not sci_oran_prompt12_single.command_executed
          - not sci_oran_prompt12_single.control_executed
          - not sci_oran_prompt12_single.traffic_executed
        fail_msg: PROMPT12_T2_ONLY_INVARIANT_FAILED

    - name: End safely after offline validation
      ansible.builtin.meta: end_play
      when: sci_oran_prompt12_mode | default('offline-validate') == 'offline-validate'

    - name: Validate explicit live authorization
      ansible.builtin.assert:
        that:
          - sci_oran_prompt12_live_authorization_token is defined
          - sci_oran_prompt12_live_authorization_token == sci_oran_prompt12_live_authorization_token_expected
          - sci_oran_prompt12_authoritative_readback_argv is defined
          - sci_oran_prompt12_authoritative_readback_argv is sequence
          - sci_oran_prompt12_authoritative_readback_argv | length > 0
          - (sci_oran_prompt12_authoritative_readback_argv | select('equalto', '--window-start') | list | length) == 1
          - (sci_oran_prompt12_authoritative_readback_argv | select('equalto', '--window-end') | list | length) == 1
          - (sci_oran_prompt12_authoritative_readback_argv | select('equalto', sci_oran_prompt12_readback_window_end_placeholder) | list | length) == 1
          - >-
            (
              (sci_oran_prompt12_authoritative_readback_argv | select('equalto', '--window-end') | list | length) == 1
              and
              (
                sci_oran_prompt12_authoritative_readback_argv.index('--window-end') + 1
              ) < (sci_oran_prompt12_authoritative_readback_argv | length)
              and
              sci_oran_prompt12_authoritative_readback_argv[
                sci_oran_prompt12_authoritative_readback_argv.index('--window-end') + 1
              ] == sci_oran_prompt12_readback_window_end_placeholder
            )
        fail_msg: PROMPT12_LIVE_AUTHORIZATION_INVALID

    - name: Require explicit T2 control authorization before traffic
      ansible.builtin.assert:
        that:
          - sci_oran_prompt12_control_authorization_token is defined
          - sci_oran_prompt12_control_authorization_token == 'PROMPT12_T2_EXPLICIT_FIFO_CONTROL'
          - (sci_oran_prompt12_single.trigger_command | select('equalto', '--control-authorization-token') | list | length) == 1
          - (sci_oran_prompt12_single.trigger_command | select('equalto', '@PROMPT12_CONTROL_AUTHORIZATION_TOKEN@') | list | length) == 1
          - (sci_oran_prompt12_single.trigger_command | select('equalto', 'PROMPT12_T2_EXPLICIT_FIFO_CONTROL') | list | length) == 0
        fail_msg: PROMPT12_T2_CONTROL_AUTHORIZATION_NOT_EXPLICIT

    - name: Start bounded scientific traffic asynchronously
      ansible.builtin.command:
        argv: "{{ sci_oran_prompt12_single.traffic_command }}"
      environment:
        SCI_ORAN_PROMPT12_LIVE_TRAFFIC_ENABLE: "YES"
      async: 240
      poll: 0
      register: sci_oran_prompt12_traffic_job
      changed_when: true

    - name: Validate bounded traffic evidence argv contract
      ansible.builtin.assert:
        that:
          - sci_oran_prompt12_single.traffic_command | length == 7
          - sci_oran_prompt12_single.traffic_command[4] | length > 0
          - sci_oran_prompt12_single.traffic_command[5] | length > 0
          - sci_oran_prompt12_single.traffic_command[4] is match('^/')
          - sci_oran_prompt12_single.traffic_command[5] is match('^/')
        fail_msg: PROMPT12_TRAFFIC_EVIDENCE_ARGV_INVALID

    - name: Read bounded traffic status after launch
      ansible.builtin.async_status:
        jid: "{{ sci_oran_prompt12_traffic_job.ansible_job_id }}"
      register: sci_oran_prompt12_traffic_postlaunch
      changed_when: false
      failed_when: false

    - name: Require bounded traffic active after launch
      ansible.builtin.assert:
        that:
          - not (sci_oran_prompt12_traffic_postlaunch.failed | default(false) | bool)
          - sci_oran_prompt12_traffic_postlaunch.finished is defined
          - not (sci_oran_prompt12_traffic_postlaunch.finished | bool)
        fail_msg: PROMPT12_TRAFFIC_NOT_ACTIVE_AFTER_LAUNCH

    - name: Wait for bounded traffic raw evidence file
      ansible.builtin.wait_for:
        path: "{{ sci_oran_prompt12_single.traffic_command[4] }}"
        state: present
        timeout: 15

    - name: Wait for bounded traffic timestamp evidence file
      ansible.builtin.wait_for:
        path: "{{ sci_oran_prompt12_single.traffic_command[5] }}"
        state: present
        timeout: 15

    - name: Wait for bounded traffic raw evidence to become nonempty
      ansible.builtin.stat:
        path: "{{ sci_oran_prompt12_single.traffic_command[4] }}"
        follow: true
      register: sci_oran_prompt12_raw_prephase
      until:
        - sci_oran_prompt12_raw_prephase.stat.exists | default(false)
        - sci_oran_prompt12_raw_prephase.stat.isreg | default(false)
        - (sci_oran_prompt12_raw_prephase.stat.size | default(0) | int) > 0
      retries: 15
      delay: 1
      changed_when: false

    - name: Wait for bounded traffic timestamp evidence to become nonempty
      ansible.builtin.stat:
        path: "{{ sci_oran_prompt12_single.traffic_command[5] }}"
        follow: true
      register: sci_oran_prompt12_timestamp_prephase
      until:
        - sci_oran_prompt12_timestamp_prephase.stat.exists | default(false)
        - sci_oran_prompt12_timestamp_prephase.stat.isreg | default(false)
        - (sci_oran_prompt12_timestamp_prephase.stat.size | default(0) | int) > 0
      retries: 15
      delay: 1
      changed_when: false

    - name: Capture Prompt12 pre-phase readiness time
      ansible.builtin.command:
        argv:
          - /bin/date
          - -u
          - +%s%N
      register: sci_oran_prompt12_prephase_start_ns
      changed_when: false

    - name: Accumulate minimum Prompt12 pre-phase
      ansible.builtin.pause:
        seconds: 11

    - name: Read bounded traffic status after minimum pre-phase
      ansible.builtin.async_status:
        jid: "{{ sci_oran_prompt12_traffic_job.ansible_job_id }}"
      register: sci_oran_prompt12_traffic_after_prephase
      changed_when: false
      failed_when: false

    - name: Require bounded traffic active after minimum pre-phase
      ansible.builtin.assert:
        that:
          - not (sci_oran_prompt12_traffic_after_prephase.failed | default(false) | bool)
          - sci_oran_prompt12_traffic_after_prephase.finished is defined
          - not (sci_oran_prompt12_traffic_after_prephase.finished | bool)
        fail_msg: PROMPT12_TRAFFIC_NOT_ACTIVE_AFTER_PREPHASE

    - name: Read bounded traffic raw evidence after minimum pre-phase
      ansible.builtin.stat:
        path: "{{ sci_oran_prompt12_single.traffic_command[4] }}"
        follow: true
      register: sci_oran_prompt12_raw_postphase
      changed_when: false

    - name: Read bounded traffic timestamp evidence after minimum pre-phase
      ansible.builtin.stat:
        path: "{{ sci_oran_prompt12_single.traffic_command[5] }}"
        follow: true
      register: sci_oran_prompt12_timestamp_postphase
      changed_when: false

    - name: Capture Prompt12 pre-phase completion time
      ansible.builtin.command:
        argv:
          - /bin/date
          - -u
          - +%s%N
      register: sci_oran_prompt12_prephase_end_ns
      changed_when: false

    - name: Require bounded traffic evidence growth
      ansible.builtin.assert:
        that:
          - sci_oran_prompt12_raw_postphase.stat.exists | default(false)
          - sci_oran_prompt12_raw_postphase.stat.isreg | default(false)
          - sci_oran_prompt12_timestamp_postphase.stat.exists | default(false)
          - sci_oran_prompt12_timestamp_postphase.stat.isreg | default(false)
          - (sci_oran_prompt12_raw_postphase.stat.size | int) > (sci_oran_prompt12_raw_prephase.stat.size | int)
          - (sci_oran_prompt12_timestamp_postphase.stat.size | int) > (sci_oran_prompt12_timestamp_prephase.stat.size | int)
          - ((sci_oran_prompt12_prephase_end_ns.stdout | int) - (sci_oran_prompt12_prephase_start_ns.stdout | int)) >= 11000000000
        fail_msg: PROMPT12_TRAFFIC_PREPHASE_EVIDENCE_GATE_FAILED

    - name: Execute resumed T2 initial precontrol
      ansible.builtin.command:
        argv: "{{ sci_oran_prompt12_single.initial_precontrol_command }}"
      register: sci_oran_prompt12_initial_precontrol
      changed_when: true

    - name: Decode resumed T2 initial precontrol stationarity report
      ansible.builtin.set_fact:
        sci_oran_prompt12_initial_pre_report: >-
          {{
            sci_oran_prompt12_initial_precontrol.stdout
            | from_json
          }}

    - name: Require resumed T2 initial precontrol stationarity
      ansible.builtin.assert:
        that:
          - sci_oran_prompt12_initial_pre_report.output_stationarity_gate == 'PASS'
          - sci_oran_prompt12_initial_pre_report.minimum_phase_duration_gate == 'PASS'
          - sci_oran_prompt12_initial_pre_report.statistical_phase_candidate == 'PASS'
        fail_msg: PROMPT12_T2_INITIAL_PRECONTROL_NOT_STATIONARY

    - name: Execute T2 ratio binding
      ansible.builtin.command:
        argv: "{{ sci_oran_prompt12_single.ratio_bind_command }}"
      register: sci_oran_prompt12_ratio_bind
      changed_when: true

    - name: Require T2 ratio binding admission
      ansible.builtin.assert:
        that:
          - "'RATIO_BOUND=PASS' in sci_oran_prompt12_ratio_bind.stdout_lines"
        fail_msg: PROMPT12_T2_RATIO_BIND_FAILED

    - name: Read bounded traffic status immediately before T2 trigger
      ansible.builtin.async_status:
        jid: "{{ sci_oran_prompt12_traffic_job.ansible_job_id }}"
      register: sci_oran_prompt12_traffic_pretrigger
      changed_when: false
      failed_when: false

    - name: Require bounded traffic active immediately before T2 trigger
      ansible.builtin.assert:
        that:
          - not (sci_oran_prompt12_traffic_pretrigger.failed | default(false) | bool)
          - sci_oran_prompt12_traffic_pretrigger.finished is defined
          - not (sci_oran_prompt12_traffic_pretrigger.finished | bool)
        fail_msg: PROMPT12_TRAFFIC_NOT_ACTIVE_BEFORE_T2_TRIGGER

    - name: Late-bind T2 control authorization in memory
      ansible.builtin.set_fact:
        sci_oran_prompt12_effective_trigger_command: >-
          {{
            sci_oran_prompt12_single.trigger_command
            | map(
                'regex_replace',
                '^@PROMPT12_CONTROL_AUTHORIZATION_TOKEN@$',
                sci_oran_prompt12_control_authorization_token
              )
            | list
          }}

    - name: Require effective T2 control authorization binding
      ansible.builtin.assert:
        that:
          - (sci_oran_prompt12_effective_trigger_command | length) == (sci_oran_prompt12_single.trigger_command | length)
          - (sci_oran_prompt12_effective_trigger_command | select('equalto', '@PROMPT12_CONTROL_AUTHORIZATION_TOKEN@') | list | length) == 0
          - (sci_oran_prompt12_effective_trigger_command | select('equalto', 'PROMPT12_T2_EXPLICIT_FIFO_CONTROL') | list | length) == 1
          - (sci_oran_prompt12_effective_trigger_command | select('equalto', '--control-authorization-token') | list | length) == 1
        fail_msg: PROMPT12_T2_CONTROL_AUTHORIZATION_LATE_BIND_FAILED

    - name: Execute exactly-once T2 scientific trigger
      ansible.builtin.command:
        argv: "{{ sci_oran_prompt12_effective_trigger_command }}"
      register: sci_oran_prompt12_trigger
      changed_when: true


    - name: Capture T2 post-phase start
      ansible.builtin.command:
        argv:
          - /bin/date
          - -u
          - +%s%N
      register: sci_oran_prompt12_postphase_start_ns
      changed_when: false

    - name: Read bounded traffic status immediately after T2 trigger
      ansible.builtin.async_status:
        jid: "{{ sci_oran_prompt12_traffic_job.ansible_job_id }}"
      register: sci_oran_prompt12_traffic_posttrigger
      changed_when: false
      failed_when: false

    - name: Require bounded traffic active immediately after T2 trigger
      ansible.builtin.assert:
        that:
          - not (sci_oran_prompt12_traffic_posttrigger.failed | default(false) | bool)
          - sci_oran_prompt12_traffic_posttrigger.finished is defined
          - not (sci_oran_prompt12_traffic_posttrigger.finished | bool)
        fail_msg: PROMPT12_TRAFFIC_NOT_ACTIVE_AFTER_T2_TRIGGER

    - name: Read bounded traffic raw evidence size at T2 post-phase start
      ansible.builtin.stat:
        path: "{{ sci_oran_prompt12_single.traffic_command[4] }}"
      register: sci_oran_prompt12_postphase_raw_before

    - name: Read bounded traffic timestamp evidence size at T2 post-phase start
      ansible.builtin.stat:
        path: "{{ sci_oran_prompt12_single.traffic_command[5] }}"
      register: sci_oran_prompt12_postphase_timestamps_before

    - name: Require bounded traffic evidence present at T2 post-phase start
      ansible.builtin.assert:
        that:
          - sci_oran_prompt12_postphase_raw_before.stat.exists
          - sci_oran_prompt12_postphase_raw_before.stat.isreg
          - (sci_oran_prompt12_postphase_raw_before.stat.size | int) > 0
          - sci_oran_prompt12_postphase_timestamps_before.stat.exists
          - sci_oran_prompt12_postphase_timestamps_before.stat.isreg
          - (sci_oran_prompt12_postphase_timestamps_before.stat.size | int) > 0
        fail_msg: PROMPT12_TRAFFIC_POSTPHASE_INITIAL_EVIDENCE_MISSING

    - name: Capture authoritative T2 readback window end
      ansible.builtin.command:
        argv:
          - /bin/date
          - -u
          - +%Y-%m-%dT%H:%M:%S.%6NZ
      register: sci_oran_prompt12_readback_window_end
      changed_when: false

    - name: Late-bind authoritative T2 readback window end
      ansible.builtin.set_fact:
        sci_oran_prompt12_effective_authoritative_readback_argv: >-
          {{
            sci_oran_prompt12_authoritative_readback_argv
            | map(
                'regex_replace',
                '^@PROMPT12_READBACK_WINDOW_END@$',
                sci_oran_prompt12_readback_window_end.stdout | trim
              )
            | list
          }}

    - name: Require effective authoritative T2 readback window end binding
      ansible.builtin.assert:
        that:
          - (sci_oran_prompt12_effective_authoritative_readback_argv | length) == (sci_oran_prompt12_authoritative_readback_argv | length)
          - (sci_oran_prompt12_effective_authoritative_readback_argv | select('equalto', sci_oran_prompt12_readback_window_end_placeholder) | list | length) == 0
          - (sci_oran_prompt12_effective_authoritative_readback_argv | select('equalto', '--window-end') | list | length) == 1
          - >-
            sci_oran_prompt12_effective_authoritative_readback_argv[
              sci_oran_prompt12_effective_authoritative_readback_argv.index('--window-end') + 1
            ] == (sci_oran_prompt12_readback_window_end.stdout | trim)
        fail_msg: PROMPT12_T2_READBACK_WINDOW_END_LATE_BIND_FAILED

    - name: Obtain authoritative applied PRB readback
      ansible.builtin.command:
        argv: "{{ sci_oran_prompt12_effective_authoritative_readback_argv }}"
      register: sci_oran_prompt12_applied_readback
      changed_when: false

    - name: Decode authoritative applied PRB readback
      ansible.builtin.set_fact:
        sci_oran_prompt12_applied_readback_report: >-
          {{
            sci_oran_prompt12_applied_readback.stdout
            | from_json
          }}

    - name: Require authoritative T2 applied state 39 PRB
      ansible.builtin.assert:
        that:
          - sci_oran_prompt12_applied_readback.rc == 0
          - sci_oran_prompt12_applied_readback_report.schema == 'sci_oran_prompt12_authoritative_prb_readback_v1'
          - sci_oran_prompt12_applied_readback_report.authoritative_source == 'CONTAINER:/tmp/gnb.log'
          - not sci_oran_prompt12_applied_readback_report.docker_logs_is_authoritative
          - sci_oran_prompt12_applied_readback_report.expected_min_prbs == 0
          - sci_oran_prompt12_applied_readback_report.expected_max_prbs == 39
          - sci_oran_prompt12_applied_readback_report.u_applied_readback_gate == 'PASS'
          - sci_oran_prompt12_applied_readback_report.selected.applied_min_prbs == 0
          - sci_oran_prompt12_applied_readback_report.selected.applied_max_prbs == 39
        fail_msg: PROMPT12_T2_AUTHORITATIVE_APPLIED_READBACK_FAILED


    - name: Accumulate minimum T2 post-phase
      ansible.builtin.pause:
        seconds: 10

    - name: Read bounded traffic status after minimum T2 post-phase
      ansible.builtin.async_status:
        jid: "{{ sci_oran_prompt12_traffic_job.ansible_job_id }}"
      register: sci_oran_prompt12_traffic_postphase
      changed_when: false
      failed_when: false

    - name: Require bounded traffic active after minimum T2 post-phase
      ansible.builtin.assert:
        that:
          - not (sci_oran_prompt12_traffic_postphase.failed | default(false) | bool)
          - sci_oran_prompt12_traffic_postphase.finished is defined
          - not (sci_oran_prompt12_traffic_postphase.finished | bool)
        fail_msg: PROMPT12_TRAFFIC_NOT_ACTIVE_AFTER_POSTPHASE

    - name: Read bounded traffic raw evidence after minimum T2 post-phase
      ansible.builtin.stat:
        path: "{{ sci_oran_prompt12_single.traffic_command[4] }}"
      register: sci_oran_prompt12_postphase_raw_after

    - name: Read bounded traffic timestamp evidence after minimum T2 post-phase
      ansible.builtin.stat:
        path: "{{ sci_oran_prompt12_single.traffic_command[5] }}"
      register: sci_oran_prompt12_postphase_timestamps_after

    - name: Capture T2 post-phase end
      ansible.builtin.command:
        argv:
          - /bin/date
          - -u
          - +%s%N
      register: sci_oran_prompt12_postphase_end_ns
      changed_when: false

    - name: Require bounded traffic post-phase evidence growth
      ansible.builtin.assert:
        that:
          - sci_oran_prompt12_postphase_raw_after.stat.exists
          - sci_oran_prompt12_postphase_raw_after.stat.isreg
          - sci_oran_prompt12_postphase_timestamps_after.stat.exists
          - sci_oran_prompt12_postphase_timestamps_after.stat.isreg
          - >-
            (sci_oran_prompt12_postphase_raw_after.stat.size | int)
            >
            (sci_oran_prompt12_postphase_raw_before.stat.size | int)
          - >-
            (sci_oran_prompt12_postphase_timestamps_after.stat.size | int)
            >
            (sci_oran_prompt12_postphase_timestamps_before.stat.size | int)
          - >-
            (
              (sci_oran_prompt12_postphase_end_ns.stdout | int)
              -
              (sci_oran_prompt12_postphase_start_ns.stdout | int)
            ) >= 10000000000
        fail_msg: PROMPT12_TRAFFIC_POSTPHASE_EVIDENCE_GATE_FAILED

    - name: Execute pure resumed T2 post-step stationarity
      ansible.builtin.command:
        argv: "{{ sci_oran_prompt12_single.post_stationarity_command }}"
      register: sci_oran_prompt12_post_stationarity
      changed_when: true

    - name: Decode T2 post-step stationarity result
      ansible.builtin.set_fact:
        sci_oran_prompt12_post_report: >-
          {{
            sci_oran_prompt12_post_stationarity.stdout
            | from_json
          }}

    - name: Require T2 post-step stationarity
      ansible.builtin.assert:
        that:
          - sci_oran_prompt12_post_report.output_stationarity_gate == 'PASS'
          - sci_oran_prompt12_post_report.minimum_phase_duration_gate == 'PASS'
        fail_msg: PROMPT12_T2_POST_STATIONARITY_FAILED

    - name: Wait for bounded traffic session natural completion
      ansible.builtin.async_status:
        jid: "{{ sci_oran_prompt12_traffic_job.ansible_job_id }}"
      register: sci_oran_prompt12_traffic_status
      until: sci_oran_prompt12_traffic_status.finished
      retries: 240
      delay: 1
      changed_when: false

    - name: Require bounded traffic session success
      ansible.builtin.assert:
        that:
          - sci_oran_prompt12_traffic_status.rc == 0
        fail_msg: PROMPT12_BOUNDED_TRAFFIC_SESSION_FAILED

    - name: Execute resumed T2 finalization
      ansible.builtin.command:
        argv: "{{ sci_oran_prompt12_single.finalization_command }}"
      register: sci_oran_prompt12_finalization
      changed_when: true

    - name: Report successful bounded T2 orchestration
      ansible.builtin.debug:
        msg:
          - PROMPT12_RESUMED_SINGLE_TRANSITION_GATE=PASS
          - FIRST_SCIENTIFIC_TRANSITION=T2
          - SCIENTIFIC_TRANSITION_INDEX=2
          - EXECUTED_TRANSITION_ORDINAL=1
          - EXPECTED_TIMELINE_EVENT_COUNT=3
          - AUTOMATIC_TRIGGER_REPLAY=NO
          - T3_HANDOFF=NO
          - T3_TRIGGER=NO

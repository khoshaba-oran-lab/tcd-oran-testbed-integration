---
- name: Sci-O-RAN Tb3 controlled reset admission
  hosts: sci_oran_vms
  gather_facts: true

  vars:
    sci_oran_repo_root: >-
      {{ ansible_env.HOME }}/project/tcd-oran-testbed-integration

    sci_oran_reset_teardown_id: >-
      {{
        reset_operation_id
        | regex_replace(
            '^lifecycle-reset-',
            'lifecycle-teardown-'
          )
      }}

    sci_oran_reset_deploy_id: >-
      {{
        reset_operation_id
        | regex_replace(
            '^lifecycle-reset-',
            'lifecycle-deploy-'
          )
      }}

  tasks:
    - name: Require explicit reset confirmation
      ansible.builtin.assert:
        that:
          - confirm_reset | default(false) | bool
        fail_msg: >-
          Controlled reset requires explicit -e confirm_reset=true.

    - name: Require reset operation identity
      ansible.builtin.assert:
        that:
          - reset_operation_id is defined
          - reset_operation_id is string
          - >-
            reset_operation_id is match(
              '^lifecycle-reset-[0-9]{8}T[0-9]{6}Z-[a-z0-9]{8}$'
            )
        fail_msg: >-
          A valid lifecycle-reset operation identity is required.

    - name: Verify derived reset child identities
      ansible.builtin.assert:
        that:
          - >-
            sci_oran_reset_teardown_id is match(
              '^lifecycle-teardown-[0-9]{8}T[0-9]{6}Z-[a-z0-9]{8}$'
            )
          - >-
            sci_oran_reset_deploy_id is match(
              '^lifecycle-deploy-[0-9]{8}T[0-9]{6}Z-[a-z0-9]{8}$'
            )
        fail_msg: >-
          Reset child operation identity derivation failed.

    - name: Inspect reset child evidence directories
      ansible.builtin.stat:
        path: >-
          {{ sci_oran_repo_root }}/artifacts/lifecycle/{{ item }}
      loop:
        - "{{ sci_oran_reset_teardown_id }}"
        - "{{ sci_oran_reset_deploy_id }}"
      register: sci_oran_reset_child_dirs

    - name: Refuse reset child evidence overwrite
      ansible.builtin.assert:
        that:
          - not item.stat.exists
        fail_msg: >-
          Reset child evidence directory already exists:
          {{ item.item }}.
      loop: "{{ sci_oran_reset_child_dirs.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Report controlled reset correlation
      ansible.builtin.debug:
        msg:
          - "RESET_OPERATION_ID={{ reset_operation_id }}"
          - "RESET_TEARDOWN_OPERATION_ID={{ sci_oran_reset_teardown_id }}"
          - "RESET_DEPLOY_OPERATION_ID={{ sci_oran_reset_deploy_id }}"
          - "RESET_ADMISSION_GATE=PASS"

- import_playbook: tb3-teardown.yml
  vars:
    operation_id: >-
      {{
        reset_operation_id
        | regex_replace(
            '^lifecycle-reset-',
            'lifecycle-teardown-'
          )
      }}
    confirm_teardown: true

- import_playbook: tb3-deploy.yml
  vars:
    operation_id: >-
      {{
        reset_operation_id
        | regex_replace(
            '^lifecycle-reset-',
            'lifecycle-deploy-'
          )
      }}
    confirm_deploy: true

- name: Sci-O-RAN Tb3 controlled reset final gate
  hosts: sci_oran_vms
  gather_facts: true

  vars:
    sci_oran_repo_root: >-
      {{ ansible_env.HOME }}/project/tcd-oran-testbed-integration

    sci_oran_reset_teardown_id: >-
      {{
        reset_operation_id
        | regex_replace(
            '^lifecycle-reset-',
            'lifecycle-teardown-'
          )
      }}

    sci_oran_reset_deploy_id: >-
      {{
        reset_operation_id
        | regex_replace(
            '^lifecycle-reset-',
            'lifecycle-deploy-'
          )
      }}

    sci_oran_reset_expected_containers:
      - name: base05_open5gs_5gc
        image_id: >-
          sha256:e584550ebb654abcce8801c479d977f97b0397319e5dd92c1e06b7091d92160d

      - name: action11_202_flexric_ric_safe
        image_id: >-
          sha256:02a7181afaf1cb5892bbaaaeb3808e9db9bcb7594fa48396e3da56e210bc60bb

      - name: base05_srsran_gnb
        image_id: >-
          sha256:aac094264803c663fd714af28840aa9db10d323526c5e0ca6cbc22645022c292

      - name: base05_srsran_srsue
        image_id: >-
          sha256:ea98a2ab87f98037bc172f8422dc1f5fc65ebad21f847bc10b5765b9ecf02410

  tasks:
    - name: Inspect reset child manifests
      ansible.builtin.command:
        argv:
          - cat
          - >-
            {{ sci_oran_repo_root }}/artifacts/lifecycle/{{ item }}/manifest.json
      loop:
        - "{{ sci_oran_reset_teardown_id }}"
        - "{{ sci_oran_reset_deploy_id }}"
      register: sci_oran_reset_manifests
      changed_when: false

    - name: Require successful reset child manifests
      ansible.builtin.assert:
        that:
          - >-
            (sci_oran_reset_manifests.results[0].stdout | from_json)
            ['operation_type'] == 'teardown'
          - >-
            (sci_oran_reset_manifests.results[0].stdout | from_json)
            ['operation_result'] == 'PASS'
          - >-
            (sci_oran_reset_manifests.results[1].stdout | from_json)
            ['operation_type'] == 'deploy'
          - >-
            (sci_oran_reset_manifests.results[1].stdout | from_json)
            ['operation_result'] == 'PASS'
        fail_msg: >-
          Reset child evidence does not prove successful teardown
          and deploy.

    - name: Inspect reset lifecycle containers
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - "{{ item.name }}"
      loop: "{{ sci_oran_reset_expected_containers }}"
      register: sci_oran_reset_containers
      changed_when: false

    - name: Require exact reset runtime identity
      ansible.builtin.assert:
        that:
          - (item.stdout | from_json)[0]['State']['Running']
          - >-
            (item.stdout | from_json)[0]['Image']
            == item.item.image_id
          - >-
            (item.stdout | from_json)[0]['RestartCount'] == 0
        fail_msg: >-
          Reset runtime identity mismatch for {{ item.item.name }}.
      loop: "{{ sci_oran_reset_containers.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Require reset 5GC healthy state
      ansible.builtin.assert:
        that:
          - >-
            (sci_oran_reset_containers.results[0].stdout | from_json)
            [0]['State']['Health']['Status'] == 'healthy'
        fail_msg: "Reset 5GC is not healthy."

    - name: Inspect reset lifecycle network
      ansible.builtin.command:
        argv:
          - docker
          - network
          - inspect
          - tcd-base05-zmq_ran
      register: sci_oran_reset_network
      changed_when: false

    - name: Require exact reset network contract
      ansible.builtin.assert:
        that:
          - "'base05_open5gs_5gc' in sci_oran_reset_network.stdout"
          - "'base05_srsran_gnb' in sci_oran_reset_network.stdout"
          - "'base05_srsran_srsue' in sci_oran_reset_network.stdout"
          - >-
            'action11_202_flexric_ric_safe'
            in sci_oran_reset_network.stdout
          - "'10.53.1.2' in sci_oran_reset_network.stdout"
          - "'10.53.1.3' in sci_oran_reset_network.stdout"
          - "'10.53.1.4' in sci_oran_reset_network.stdout"
          - "'10.53.1.10' in sci_oran_reset_network.stdout"
        fail_msg: >-
          Reset lifecycle network membership/IP contract mismatch.

    - name: Report controlled reset result
      ansible.builtin.debug:
        msg:
          - "RESET_OPERATION_ID={{ reset_operation_id }}"
          - "RESET_TEARDOWN_OPERATION_ID={{ sci_oran_reset_teardown_id }}"
          - "RESET_DEPLOY_OPERATION_ID={{ sci_oran_reset_deploy_id }}"
          - "RESET_CHILD_EVIDENCE_GATE=PASS"
          - "RESET_RUNTIME_CONTAINER_GATE=PASS"
          - "RESET_RUNTIME_IMAGE_IDENTITY_GATE=PASS"
          - "RESET_RUNTIME_NETWORK_GATE=PASS"
          - "CONTROLLED_RESET_GATE=PASS"

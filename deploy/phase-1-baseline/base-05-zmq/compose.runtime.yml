{
  "name": "tcd-base05-zmq",
  "services": {
    "5gc": {
      "command": [
        "5gc",
        "-c",
        "open5gs-5gc.yml"
      ],
      "container_name": "base05_open5gs_5gc",
      "entrypoint": null,
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "nc -z 127.0.0.20 7777"
        ],
        "timeout": "1s",
        "interval": "3s",
        "retries": 60
      },
      "networks": {
        "ran": {
          "ipv4_address": "10.53.1.2"
        }
      },
      "ports": [
        {
          "mode": "ingress",
          "target": 9999,
          "published": "9999",
          "protocol": "tcp"
        }
      ],
      "privileged": true,
      "image": "tcd-oran/base05-open5gs:v2.7.0-e584550e",
      "env_file": [
        "./configs/open5gs.env"
      ],
      "pull_policy": "never"
    },
    "gnb": {
      "cap_add": [
        "SYS_NICE",
        "CAP_SYS_PTRACE"
      ],
      "command": [
        "/usr/local/bin/gnb",
        "-c",
        "/gnb_zmq_base05.yaml"
      ],
      "container_name": "base05_srsran_gnb",
      "depends_on": {
        "5gc": {
          "condition": "service_healthy"
        }
      },
      "entrypoint": null,
      "image": "srsran/gnb-zmq:24.10.0-eca587d0597a-v2",
      "networks": {
        "ran": {
          "ipv4_address": "10.53.1.3"
        }
      },
      "privileged": true,
      "stdin_open": true,
      "tty": true,
      "volumes": [
        {
          "type": "volume",
          "source": "gnb-storage",
          "target": "/tmp"
        },
        {
          "type": "bind",
          "source": "./configs/gnb_zmq_base05.yaml",
          "target": "/gnb_zmq_base05.yaml",
          "read_only": true
        }
      ],
      "pull_policy": "never"
    },
    "srsue": {
      "cap_add": [
        "NET_ADMIN",
        "SYS_NICE"
      ],
      "command": [
        "/ue_zmq_base05.conf"
      ],
      "container_name": "base05_srsran_srsue",
      "depends_on": {
        "gnb": {
          "condition": "service_started"
        }
      },
      "devices": [
        "/dev/net/tun:/dev/net/tun"
      ],
      "entrypoint": [
        "/usr/local/bin/srsue"
      ],
      "image": "srsran/srsue-zmq:23.11-eea87b1d893a",
      "networks": {
        "ran": {
          "ipv4_address": "10.53.1.4"
        }
      },
      "stdin_open": true,
      "tty": true,
      "volumes": [
        {
          "type": "bind",
          "source": "./configs/ue_zmq_base05.conf",
          "target": "/ue_zmq_base05.conf",
          "read_only": true
        }
      ],
      "pull_policy": "never"
    }
  },
  "networks": {
    "ran": {
      "driver": "bridge",
      "ipam": {
        "config": [
          {
            "subnet": "10.53.1.0/24"
          }
        ]
      }
    }
  },
  "volumes": {
    "gnb-storage": {}
  }
}

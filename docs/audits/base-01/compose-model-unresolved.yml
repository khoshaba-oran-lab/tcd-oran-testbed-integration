configs:
  gnb_config.yml:
    file: /home/ubuntu/upstream/CONVERGE-summer-school/srsRAN/docker/${GNB_CONFIG_PATH:-../configs/gnb_rf_b200_tdd_n78_20mhz.yml}
    name: converge-no-ric_gnb_config.yml
name: converge-no-ric
networks:
  metrics:
    ipam:
      config:
        - subnet: 172.19.1.0/24
      driver: default
    name: converge-no-ric_metrics
  ran:
    ipam:
      config:
        - subnet: 10.53.1.0/24
      driver: default
    name: converge-no-ric_ran
services:
  5gc:
    build:
      args:
        OPEN5GS_VERSION: v2.7.0
        OS_VERSION: "22.04"
      context: /home/ubuntu/upstream/CONVERGE-summer-school/srsRAN/docker/open5gs
      dockerfile: Dockerfile
      target: open5gs
    command: 5gc -c open5gs-5gc.yml
    container_name: open5gs_5gc
    env_file:
      - path: /home/ubuntu/upstream/CONVERGE-summer-school/srsRAN/docker/${OPEN_5GS_ENV_FILE:-open5gs/open5gs.env}
        required: true
    healthcheck:
      interval: 3s
      retries: 60
      test:
        - CMD-SHELL
        - nc -z 127.0.0.20 7777
      timeout: 1s
    networks:
      ran:
        ipv4_address: ${OPEN5GS_IP:-10.53.1.2}
    ports:
      - mode: ingress
        protocol: tcp
        published: "9999"
        target: 9999
    privileged: true
  gnb:
    build:
      args:
        OS_VERSION: "24.04"
      context: /home/ubuntu/upstream/CONVERGE-summer-school/srsRAN
      dockerfile: docker/Dockerfile
    cap_add:
      - SYS_NICE
      - CAP_SYS_PTRACE
    command: gnb -c gnb_config.yml -c testmode.yml
    container_name: srsran_gnb
    depends_on:
      5gc:
        condition: service_healthy
        required: true
    image: srsran/gnb
    networks:
      metrics:
        ipv4_address: 172.19.1.3
      ran:
        ipv4_address: ${GNB_IP:-10.53.1.3}
    privileged: true
    stdin_open: true
    tty: true
    volumes:
      - source: gnb-storage
        target: /tmp
        type: volume
        volume: {}
      - bind:
          create_host_path: true
        source: /home/ubuntu/upstream/CONVERGE-summer-school/srsRAN/docker/srsRAN_conf/gnb_config_no_ric.yml
        target: /gnb_config.yml
        type: bind
      - bind:
          create_host_path: true
        source: /home/ubuntu/upstream/CONVERGE-summer-school/srsRAN/docker/srsRAN_conf/testmode.yml
        target: /testmode.yml
        type: bind
  grafana:
    build:
      args:
        GRAFANA_VERSION: ${DOCKER_GRAFANA_VERSION}
        LOGO_URL: ${GRAFANA_LOGO_URL}
      context: /home/ubuntu/upstream/CONVERGE-summer-school/srsRAN/docker/grafana
      dockerfile: Dockerfile
    container_name: grafana
    depends_on:
      influxdb:
        condition: service_started
        required: true
      metrics-server:
        condition: service_started
        required: true
    env_file:
      - path: /home/ubuntu/upstream/CONVERGE-summer-school/srsRAN/docker/.env
        required: true
    image: srsran/grafana
    networks:
      metrics:
        ipv4_address: 172.19.1.6
    ports:
      - 3300:${GRAFANA_PORT}
    volumes:
      - source: grafana-storage
        target: /var/lib/grafana
        type: volume
        volume: {}
  influxdb:
    container_name: influxdb
    env_file:
      - path: /home/ubuntu/upstream/CONVERGE-summer-school/srsRAN/docker/.env
        required: true
    image: influxdb:${DOCKER_INFLUXDB_VERSION}
    networks:
      metrics:
        ipv4_address: 172.19.1.5
    restart: on-failure:10
    volumes:
      - source: influxdb-storage
        target: /var/lib/influxdb2
        type: volume
        volume: {}
  metrics-server:
    build:
      context: /home/ubuntu/upstream/CONVERGE-summer-school/srsRAN/docker/metrics_server
      dockerfile: Dockerfile
    container_name: metrics_server
    environment:
      - PORT=${METRICS_SERVER_PORT}
      - BUCKET=${DOCKER_INFLUXDB_INIT_BUCKET}
      - TESTBED=default
      - URL=http://${DOCKER_INFLUXDB_INIT_HOST}:${DOCKER_INFLUXDB_INIT_PORT}
      - ORG=${DOCKER_INFLUXDB_INIT_ORG}
      - TOKEN=${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN}
    image: srsran/metrics_server
    networks:
      metrics:
        ipv4_address: 172.19.1.4
    ports:
      - 55555:${METRICS_SERVER_PORT}/udp
volumes:
  gnb-storage:
    name: converge-no-ric_gnb-storage
  grafana-storage:
    name: converge-no-ric_grafana-storage
  influxdb-storage:
    name: converge-no-ric_influxdb-storage
